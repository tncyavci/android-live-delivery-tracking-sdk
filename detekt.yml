build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 4
  MaxLineLength:
    maxLineLength: 140

complexity:
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 8

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated: ['Composable']

exceptions:
  active: true

potential-bugs:
  active: true
